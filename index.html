<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاسبتي - الآلة الحاسبة</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #2c3e50; }
        .calculator { background-color: #1a252f; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 320px; direction: ltr; }
        .display { width: 100%; height: 60px; background-color: #ecf0f1; border: none; border-radius: 8px; font-size: 28px; text-align: right; padding: 0 15px; margin-bottom: 15px; box-sizing: border-box; color: #2c3e50; font-weight: bold; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 20px; font-size: 20px; border: none; border-radius: 8px; cursor: pointer; background-color: #34495e; color: white; font-weight: bold; }
        button:hover { background-color: #4a6278; }
        .operator { background-color: #e67e22; }
        .operator:hover { background-color: #d35400; }
        .equal { background-color: #27ae60; grid-column: span 2; }
        .equal:hover { background-color: #229954; }
        .clear { background-color: #c0392b; }
        .clear:hover { background-color: #a93226; }
        .zero { grid-column: span 2; }
    </style>
</head>
<body>
<div class="calculator">
    <input type="text" class="display" id="display" readonly value="0">
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="operator" onclick="appendValue('/')">÷</button>
        <button class="operator" onclick="appendValue('*')">×</button>
        <button class="operator" onclick="appendValue('-')">-</button>
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('+')">+</button>
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="deleteLast()">⌫</button>
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="equal" onclick="calculate()">=</button>
        <button class="zero" onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
    </div>
</div>
<script>
    const display = document.getElementById('display');
    function appendValue(value) {
        if (display.value === '0' && value !== '.') { display.value = value; } 
        else { display.value += value; }
    }
    function clearDisplay() { display.value = '0'; }
    function deleteLast() { display.value = display.value.toString().slice(0, -1) || '0'; }
    function calculate() {
        try { display.value = new Function('return ' + display.value)(); } 
        catch (error) { display.value = 'خطأ'; }
    }
</script>
</body>
</html>
